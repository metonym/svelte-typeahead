on:
  pull_request:
  push:
    branches: [master]

jobs:
  checks:
    name: Type Check & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun ci

      - name: Check types
        run: bun run test:types

      - name: Run unit tests
        run: bun run test:unit

      - name: Build documentation
        run: bun run build
